services:
  - type: web
    name: nubi
    runtime: node
    plan: free
    region: oregon
    buildCommand: echo "Sin dependencias que instalar"
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: MODEL
        value: gemini-2.5-flash
      - key: RATE_PER_MIN
        value: "15"
      - key: RATE_PER_DAY
        value: "120"
      - key: GEMINI_API_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
