<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba del servidor</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; max-width: 640px; margin: 0 auto; padding: 16px; }
  input, button { font-size: 16px; padding: 10px; border-radius: 8px; border: 0; width: 100%; box-sizing: border-box; margin-top: 8px; }
  button { background: #ffc531; font-weight: 700; cursor: pointer; }
  #estado { margin-top: 16px; font-weight: 700; }
  pre { background: #000; padding: 12px; border-radius: 8px; white-space: pre-wrap; word-break: break-word; max-height: 55vh; overflow: auto; }
  .ok { color: #4ade80; } .mal { color: #f87171; }
</style>
</head>
<body>
<h2>Prueba del servidor</h2>
<label>URL del servidor</label>
<input id="url" value="/recetas">
<label>Ingredientes (separados por coma)</label>
<input id="ing" value="huevo, arroz">
<button onclick="probar()">Probar</button>
<div id="estado"></div>
<pre id="salida"></pre>

<script>
async function probar() {
  const estado = document.getElementById("estado");
  const salida = document.getElementById("salida");
  const url = document.getElementById("url").value.trim();
  const ingredientes = document.getElementById("ing").value.split(",").map(s => s.trim()).filter(Boolean);
  estado.className = "";
  estado.textContent = "Enviando... (si el servidor estaba dormido, puede tardar 50 segundos o más)";
  salida.textContent = "";
  const t0 = Date.now();
  try {
    const r = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredientes })
    });
    const texto = await r.text();
    const seg = ((Date.now() - t0) / 1000).toFixed(1);
    estado.className = r.ok ? "ok" : "mal";
    estado.textContent = "Código " + r.status + (r.ok ? " (correcto)" : " (error)") + " · " + seg + " s";
    try { salida.textContent = JSON.stringify(JSON.parse(texto), null, 2); }
    catch { salida.textContent = texto || "(respuesta vacía)"; }
  } catch (e) {
    estado.className = "mal";
    estado.textContent = "No se pudo conectar: " + e.message;
    salida.textContent = "Si dice 'Failed to fetch', revisa la URL, que el servicio esté Live y que estés usando el mismo servidor que la app.";
  }
}
</script>
</body>
</html>
